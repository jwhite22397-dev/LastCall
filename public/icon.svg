<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0014"/>
      <stop offset="50%" style="stop-color:#1a0028"/>
      <stop offset="100%" style="stop-color:#0a0014"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00ff"/>
      <stop offset="100%" style="stop-color:#00ffff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Neon circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neon)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Clock hands indicating late night -->
  <line x1="256" y1="256" x2="256" y2="130" stroke="#ff00ff" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="256" y1="256" x2="340" y2="290" stroke="#00ffff" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="20" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Hour markers -->
  <circle cx="256" cy="96" r="8" fill="#ff00ff"/>
  <circle cx="416" cy="256" r="8" fill="#00ffff"/>
  <circle cx="256" cy="416" r="8" fill="#ff00ff"/>
  <circle cx="96" cy="256" r="8" fill="#00ffff"/>
  
  <!-- Text -->
  <text x="256" y="480" text-anchor="middle" font-family="Arial Black" font-size="48" fill="#ffffff" filter="url(#glow)">
    LAST CALL
  </text>
</svg>
